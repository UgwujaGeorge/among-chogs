# Render's free plan sleeps after 15 idle minutes. Ping the game server so players don't wait for a cold start.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 120 -o /dev/null -w "%{http_code} %{time_total}s\n" https://among-chogs-server.onrender.com/
